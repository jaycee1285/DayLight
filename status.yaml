    - Dependency is marked-extended-tables@^2.0.1 from the npm REGISTRY (a `../marked-extended-tables` local-clone path was a reproducibility bug, fixed). marked stays ^17 — the extension's declared >=3 <16 peer range is a stated test ceiling, measured PASS on 15/16/17.
    - Raw textarea fills via an autogrow action (height = scrollHeight) mirroring milkdown's content-driven height, since the parent chain (.app-shell min-h-screen) has no definite height; diagnosed with an element-tree screenshot + headless height probe, not guessed.
