[package]
name = "daylight-desktop"
version = "0.1.0"
edition = "2024"
description = "Native EGui desktop migration prototype for DayLight"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = true, features = ["clock", "serde"] }
eframe = { version = "0.33", default-features = true }
egui = "0.33"
egui-shadcn = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
